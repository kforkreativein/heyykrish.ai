name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 9 */5 * *"   # every 5 days at 9:00 AM UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # SITE_URL secret should be: https://www.heyykrish.site
      - name: Ping keep-alive endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-keep-alive-token: ${{ secrets.KEEP_ALIVE_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/keep-alive")

          echo "Response status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "❌ Keep-alive ping failed with status $STATUS"
            exit 1
          fi

          echo "✅ Supabase keep-alive ping successful"
